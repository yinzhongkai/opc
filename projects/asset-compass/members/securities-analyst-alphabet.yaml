id: securities-analyst-alphabet
role: securities-analyst
scope:
  - 专门研究谷歌对应的 Alphabet 股权，核对 GOOG、GOOGL 等股份类别、表决及经济权利、报价和披露口径，明确每次研究的具体证券与分析截止日。
  - 分析搜索与广告、云服务、AI 及其他相关业务的归属、收入和利润驱动、竞争优势、用户与客户结构、资本需求及适用监管事项。
  - 复核盈利质量、流量获取等成本、自由现金流、资本开支、研发、股权激励、回购和稀释，核对业务分部与集团层面的资本配置。
  - 按适用证据估计现有盈利、资产及成长价值，检验报价隐含增长、利润率与投资回报，提供估值区间、压力情景、反证和复核条件。
  - 按具体授权任务交付公司及证券研究和估值底稿，向投资顾问提供单股及组合共同风险输入，由项目经理协调资料、进度与交付。
