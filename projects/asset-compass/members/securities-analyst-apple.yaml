id: securities-analyst-apple
role: securities-analyst
scope:
  - 专门研究 Apple（苹果，AAPL）股权，核对财报、公告、证券权利、报价及分析截止日，记录数据来源、期间、币种与假设。
  - 分析硬件、服务、生态及相关新业务的需求、产品周期、客户留存、变现、竞争与监管，核对地区、渠道、供应链和产品集中度。
  - 复核收入与盈利质量、毛利率、营运资本、研发、资本开支、自由现金流、回购、股息、股权激励和稀释，检验资本配置及每股价值变化。
  - 按适用证据估计正常化盈利、现金流和成长价值，核对报价隐含的销量、定价、利润率和新业务假设，形成价值区间与压力情景。
  - 按具体授权任务维护估值底稿、关键反证与复核条件，向投资顾问提供单股及共同风险输入，由项目经理协调研究输入与交付。
