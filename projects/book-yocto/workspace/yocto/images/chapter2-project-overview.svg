<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">tiger 项目全景地图</title>
  <desc id="desc">从开发态源代码仓库经过 meta-tiger 与 BitBake 集成，到不同机器和部署产物的关系。</desc>
  <defs>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .head { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .label { font: 600 17px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .small { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #405e76; }
      .arrow { stroke: #4d6f8c; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4d6f8c"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="50" y="52" class="title">tiger 项目全景地图</text>

  <rect x="45" y="95" width="260" height="430" fill="#f8fbfd" stroke="#c9d8e5" stroke-width="2" rx="16"/>
  <text x="175" y="132" class="head" text-anchor="middle">开发态源代码仓库</text>
  <rect x="75" y="165" width="200" height="58" fill="#eef6ff" stroke="#2878b5" stroke-width="2" rx="10"/>
  <text x="175" y="201" class="label" text-anchor="middle">qemu-tiger</text>
  <rect x="75" y="243" width="200" height="58" fill="#eef6ff" stroke="#2878b5" stroke-width="2" rx="10"/>
  <text x="175" y="279" class="label" text-anchor="middle">tf-a-tiger</text>
  <rect x="75" y="321" width="200" height="58" fill="#eef6ff" stroke="#2878b5" stroke-width="2" rx="10"/>
  <text x="175" y="357" class="label" text-anchor="middle">u-boot-tiger</text>
  <rect x="75" y="399" width="200" height="58" fill="#eef6ff" stroke="#2878b5" stroke-width="2" rx="10"/>
  <text x="175" y="435" class="label" text-anchor="middle">linux-tiger</text>
  <text x="175" y="494" class="small" text-anchor="middle">四仓库尚待后续章节实现</text>

  <path d="M305 310 H365" class="arrow"/>
  <rect x="368" y="145" width="285" height="330" fill="#f5fbf7" stroke="#2d8a57" stroke-width="2.5" rx="16"/>
  <text x="510" y="185" class="head" text-anchor="middle">meta-tiger（集成态）</text>
  <text x="510" y="230" class="label" text-anchor="middle">MACHINE：tiger-aarch64</text>
  <text x="510" y="268" class="label" text-anchor="middle">provider / recipe / bbappend</text>
  <text x="510" y="306" class="label" text-anchor="middle">设备树与内核配置</text>
  <text x="510" y="344" class="label" text-anchor="middle">镜像格式与部署规则</text>
  <rect x="402" y="382" width="216" height="60" fill="#fff8e8" stroke="#c78925" stroke-width="1.5" rx="10"/>
  <text x="510" y="408" class="small" text-anchor="middle">平台文件名与打包方式</text>
  <text x="510" y="431" class="small" text-anchor="middle">以实现和实测为准</text>

  <path d="M653 310 H713" class="arrow"/>
  <rect x="716" y="95" width="439" height="430" fill="#f8fbfd" stroke="#c9d8e5" stroke-width="2" rx="16"/>
  <text x="935" y="132" class="head" text-anchor="middle">BitBake 解析与部署</text>
  <rect x="750" y="165" width="170" height="118" fill="#f1fbf4" stroke="#2d8a57" stroke-width="2" rx="12"/>
  <text x="835" y="198" class="label" text-anchor="middle">qemuarm64</text>
  <text x="835" y="228" class="small" text-anchor="middle">meta 提供 MACHINE</text>
  <text x="835" y="254" class="small" text-anchor="middle">Image + ext4</text>
  <rect x="950" y="165" width="170" height="118" fill="#eef6ff" stroke="#2878b5" stroke-width="2" rx="12"/>
  <text x="1035" y="198" class="label" text-anchor="middle">tiger-aarch64</text>
  <text x="1035" y="228" class="small" text-anchor="middle">meta-tiger 提供</text>
  <text x="1035" y="254" class="small" text-anchor="middle">完整启动链目标</text>
  <path d="M835 283 V330 H935" class="arrow"/>
  <path d="M1035 283 V330 H935" class="arrow"/>
  <rect x="785" y="334" width="300" height="120" fill="#faf3ff" stroke="#8352a5" stroke-width="2" rx="12"/>
  <text x="935" y="368" class="label" text-anchor="middle">tmp/deploy/images/&lt;MACHINE&gt;/</text>
  <text x="935" y="399" class="small" text-anchor="middle">构建系统实际部署的内核、DTB、</text>
  <text x="935" y="424" class="small" text-anchor="middle">固件、bootloader 与 rootfs 产物</text>

  <rect x="170" y="565" width="860" height="58" fill="#fff4f1" stroke="#c75c4a" stroke-width="1.5" rx="11"/>
  <text x="600" y="589" class="small" text-anchor="middle">Application：网关应用 / Web 配置 / 业务 SDK 由应用团队独立交付</text>
  <text x="600" y="612" class="small" text-anchor="middle">不进入 meta-tiger，但仍需独立测试、升级和许可合规检查</text>
</svg>
