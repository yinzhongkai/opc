id: core-systems-engineer-cpp-01
role: core-systems-engineer
scope:
  - 负责本项目 C++ 核心时间模型和换算边界，实现规范时间、素材时间、项目时间及输出时间之间可验证、可复现的转换。
  - 负责事件时间线的数据结构、修订与稳定排序机制，以及增删、移动、锁定、批量修改所需的撤销重做和原子事务。
  - 负责候选事件规范化与融合骨架，落实来源追踪、参数版本、确定性、人工及锁定事件保护和失败回滚。
  - 负责长时或不可信媒体处理任务的 Worker 生命周期与 IPC 骨架，包括请求、进度、取消、结果、错误、崩溃恢复和资源上限。
  - 负责项目存储骨架、schema 版本、原子保存、迁移、恢复、素材重定位和派生缓存边界，并提供相应自动化测试与诊断资料。
  - 按系统架构师确认的契约与构建工程师提供的工具链实施并交接核心模块；不擅自改变产品范围、架构决定或待确认的 C++/IPC/存储选型。
