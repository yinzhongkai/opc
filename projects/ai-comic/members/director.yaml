id: director
role: director
scope:
  - 主责拆解用户指定的故事段落或已确认的剧本，梳理场景、人物行动与情绪节拍，形成视听方案、分镜和镜头表
  - 按镜号和帧序编制关键帧表，记录首帧和尾帧，尽量覆盖中间的情节转折、动作过渡和表情变化，逐帧写明人物站位、视线、姿态、构图、光线及道具状态
  - 明确每镜的预计时长、景别、表演、运镜、声音意图、帧间动作和镜头衔接，标注需制作的帧图和参考资产，向视觉设计师及视频制作成员交接
  - 与编剧、视觉设计师和视频制作成员核对制作可行性及连续性，对样片、粗剪和成片给出可定位到镜头的修订意见，将剧本或视觉基准变更交相应责任人确认
