<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">tiger 与 qemuarm64 启动路径及构建产物对照</title>
  <desc id="desc">上方为 tiger 完整启动路径，下方为 qemuarm64 直接加载内核的对照路径。</desc>
  <defs>
    <style>
      .title { font: 700 29px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .lane { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .label { font: 600 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .small { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #36546d; }
      .tiny { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4c667c; }
      .box { fill: #eef6ff; stroke: #2878b5; stroke-width: 2; rx: 10; }
      .optional { fill: #fffdf6; stroke: #c78925; stroke-width: 2; stroke-dasharray: 7 5; rx: 10; }
      .qemu { fill: #f1fbf4; stroke: #2d8a57; stroke-width: 2; rx: 10; }
      .arrow { stroke: #4d6f8c; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4d6f8c"/>
    </marker>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="45" y="50" class="title">启动路径与可部署产物</text>

  <rect x="35" y="82" width="1130" height="292" fill="#f8fbfd" stroke="#c9d8e5" stroke-width="2" rx="16"/>
  <text x="58" y="118" class="lane">tiger 目标路径</text>
  <text x="58" y="145" class="small">Boot ROM 与可选 BL1 分开表示；蓝色框由平台构建规则接入，具体交付文件待四仓库实测确认。</text>

  <rect x="58" y="178" width="130" height="92" class="box"/>
  <text x="123" y="208" class="label" text-anchor="middle">Boot ROM</text>
  <text x="123" y="235" class="small" text-anchor="middle">SoC 固化</text>
  <text x="123" y="256" class="tiny" text-anchor="middle">非 Yocto 产物</text>
  <path d="M188 224 H208" class="arrow"/>

  <rect x="210" y="178" width="130" height="92" class="optional"/>
  <text x="275" y="208" class="label" text-anchor="middle">TF-A BL1</text>
  <text x="275" y="235" class="small" text-anchor="middle">平台可选</text>
  <text x="275" y="256" class="tiny" text-anchor="middle">bl1.bin</text>
  <path d="M340 224 H360" class="arrow"/>

  <rect x="362" y="178" width="130" height="92" class="box"/>
  <text x="427" y="208" class="label" text-anchor="middle">TF-A BL2</text>
  <text x="427" y="235" class="small" text-anchor="middle">早期初始化</text>
  <text x="427" y="256" class="tiny" text-anchor="middle">bl2.bin</text>
  <path d="M492 224 H512" class="arrow"/>

  <rect x="514" y="178" width="130" height="92" class="box"/>
  <text x="579" y="208" class="label" text-anchor="middle">TF-A BL31</text>
  <text x="579" y="235" class="small" text-anchor="middle">EL3 运行时</text>
  <text x="579" y="256" class="tiny" text-anchor="middle">bl31.bin</text>
  <path d="M644 224 H664" class="arrow"/>

  <rect x="666" y="178" width="130" height="92" class="box"/>
  <text x="731" y="208" class="label" text-anchor="middle">U-Boot</text>
  <text x="731" y="235" class="small" text-anchor="middle">BL33</text>
  <text x="731" y="256" class="tiny" text-anchor="middle">u-boot.bin / .dtb</text>
  <path d="M796 224 H816" class="arrow"/>

  <rect x="818" y="178" width="130" height="92" class="box"/>
  <text x="883" y="208" class="label" text-anchor="middle">Linux</text>
  <text x="883" y="235" class="small" text-anchor="middle">Kernel + DT</text>
  <text x="883" y="256" class="tiny" text-anchor="middle">Image / .dtb</text>
  <path d="M948 224 H968" class="arrow"/>

  <rect x="970" y="178" width="165" height="92" class="box"/>
  <text x="1052" y="208" class="label" text-anchor="middle">UBI rootfs</text>
  <text x="1052" y="235" class="small" text-anchor="middle">NAND 文件系统</text>
  <text x="1052" y="256" class="tiny" text-anchor="middle">*.ubifs / *.ubi</text>

  <path d="M123 284 C123 315 427 315 427 282" class="arrow" stroke-dasharray="6 5"/>
  <text x="275" y="340" class="tiny" text-anchor="middle">若平台不采用 BL1，Boot ROM 可直接交给 BL2</text>

  <rect x="35" y="397" width="1130" height="168" fill="#f8fbfd" stroke="#c9d8e5" stroke-width="2" rx="16"/>
  <text x="58" y="433" class="lane">qemuarm64 实测路径</text>
  <rect x="210" y="458" width="270" height="72" class="qemu"/>
  <text x="345" y="488" class="label" text-anchor="middle">runqemu / QEMU 启动流程</text>
  <text x="345" y="514" class="small" text-anchor="middle">不单独构建 TF-A 与 U-Boot</text>
  <path d="M480 494 H520" class="arrow"/>
  <rect x="522" y="458" width="220" height="72" class="qemu"/>
  <text x="632" y="488" class="label" text-anchor="middle">直接加载 Linux</text>
  <text x="632" y="514" class="small" text-anchor="middle">Image</text>
  <path d="M742 494 H782" class="arrow"/>
  <rect x="784" y="458" width="220" height="72" class="qemu"/>
  <text x="894" y="488" class="label" text-anchor="middle">ext4 rootfs</text>
  <text x="894" y="514" class="small" text-anchor="middle">core-image-minimal</text>

  <rect x="140" y="588" width="920" height="40" fill="#fff8e8" stroke="#c78925" stroke-width="1.5" rx="9"/>
  <text x="600" y="613" class="small" text-anchor="middle">fip.bin 是常见 TF-A 打包产物；flash.bin 等整合文件名属于平台约定，需在 tiger 实现后验证。</text>
</svg>
