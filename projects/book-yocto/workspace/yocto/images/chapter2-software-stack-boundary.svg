<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">tiger 软件栈三层归属</title>
  <desc id="desc">应用层位于 meta-tiger 边界之外，OS BSP 层和固件启动层位于 meta-tiger 边界之内。</desc>
  <defs>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .layer { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .item { font: 17px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #35516d; }
      .note { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4b6479; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="50" y="52" class="title">软件栈三层归属</text>

  <rect x="70" y="95" width="760" height="135" fill="#fff4f1" stroke="#c75c4a" stroke-width="2" rx="14"/>
  <text x="105" y="137" class="layer">Application 层</text>
  <text x="105" y="177" class="item">网关应用　/　Web 配置　/　业务逻辑　/　第三方 SDK</text>
  <text x="105" y="207" class="note">独立交付，单独执行测试、升级与许可合规检查</text>
  <rect x="855" y="120" width="270" height="82" fill="#fff4f1" stroke="#c75c4a" stroke-width="2" rx="12"/>
  <text x="990" y="154" class="layer" text-anchor="middle">不进 meta-tiger</text>
  <text x="990" y="183" class="note" text-anchor="middle">应用团队维护</text>

  <rect x="45" y="265" width="1110" height="290" fill="#f5fbf7" stroke="#2d8a57" stroke-width="3" rx="18"/>
  <text x="75" y="303" class="layer">meta-tiger 边界</text>

  <rect x="70" y="325" width="760" height="95" fill="#eef6ff" stroke="#2878b5" stroke-width="2" rx="12"/>
  <text x="105" y="361" class="layer">OS / BSP 层</text>
  <text x="105" y="395" class="item">Linux Kernel　/　设备树　/　基础驱动　/　根文件系统骨架</text>

  <rect x="70" y="440" width="760" height="90" fill="#f3f0ff" stroke="#7456ad" stroke-width="2" rx="12"/>
  <text x="105" y="475" class="layer">Firmware / Bootloader 层</text>
  <text x="105" y="508" class="item">TF-A（BL1、BL2、BL31）　/　U-Boot（BL33）</text>

  <rect x="855" y="350" width="270" height="135" fill="#f5fbf7" stroke="#2d8a57" stroke-width="2" rx="12"/>
  <text x="990" y="389" class="layer" text-anchor="middle">进 meta-tiger</text>
  <text x="990" y="423" class="note" text-anchor="middle">板级启动与基础运行能力</text>
  <text x="990" y="451" class="note" text-anchor="middle">由 BSP 团队维护</text>

  <text x="600" y="593" class="note" text-anchor="middle">发行版策略可由项目 layer 提供配置，但 MACHINE 只声明硬件能力，不替 DISTRO 做策略选择。</text>
</svg>
