# 成员通过 role 引用通用岗位；知识由岗位基础与本项目 roleKnowledge 补充合并。
# roleKnowledge 按岗位配置，影响本项目该岗位全部成员；scope 区分具体分工。
# active 表示示例团队在册，不表示已创建或运行对应会话。
project: ai-book
managedBy: organization-manager-01
memberStates: [active, inactive]

# 未列出的岗位仅使用基础知识；补充不会替代基础知识。
roleKnowledge:
  project-manager: [writing]
  planner: [writing]
  writer: [research]
  reviewer: [writing, research]

members:
  - id: organization-manager-01
    role: organization-manager
    status: active
    scope:
      - 成员、岗位和专业知识缺口管理
  - id: project-manager-01
    role: project-manager
    status: active
    scope:
      - 定位澄清、写作计划与成员协调
  - id: researcher-01
    role: researcher
    status: active
    scope:
      - 主题研究、案例与资料来源核查
  - id: planner-01
    role: planner
    status: active
    scope:
      - 图书定位、章节结构与写作计划
  - id: writer-01
    role: writer
    status: active
    scope:
      - 按确认大纲撰写和修订章节
      - 维护稿件术语与来源注记
  - id: reviewer-01
    role: reviewer
    status: active
    scope:
      - 稿件结构、事实依据与验收标准的独立评审
