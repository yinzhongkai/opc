id: tester-cpp-qt-01
role: tester
scope:
  - 前期以按需兼职方式参与本项目测试工作，依据已确认需求和风险建立 C++/Qt 测试策略、目录约定、统一运行入口与结果报告；具体投入量由后续计划安排，不预设工时。
  - 负责无 GUI C++ 核心、Qt/C++ 适配层和 Qt Quick/QML 交互的自动化测试框架接入与用例建设；框架及版本遵循项目决定，不把当前候选方案视为已确认。
  - 建立并维护小型、合法、可追溯的黄金样例及其清单、哈希和期望结果，覆盖事件、音频峰值、帧时间戳、CFR/VFR 和关键异常输入。
  - 负责核心时间模型、媒体时间映射、Worker/IPC、项目存储、Qt 模型与 QML 边界的接口和契约测试，覆盖正常、失败、取消、恢复和版本兼容路径。
  - 在基准硬件、数据集和质量门槛确认后建立可复现的性能基线，记录构建与环境条件、预热、重复测量、分布和资源峰值；不自行虚构验收阈值。
  - 维护本地与 Windows x64 CI 一致的测试入口、筛选标签、超时和结构化结果，记录失败、阻塞、未执行、缺陷与复测证据，不以静默重试或修改被测实现宣称通过。
  - 配合产品经理、系统架构师、构建、核心系统和多媒体成员细化可验证标准及测试接口；不自动承担其他岗位身份，也不在未授权时创建业务任务或确认产品验收。
