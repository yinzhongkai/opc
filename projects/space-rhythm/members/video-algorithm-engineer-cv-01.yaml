id: video-algorithm-engineer-cv-01
role: video-algorithm-engineer
scope:
  - 负责本项目基于 C++/OpenCV 的视频节奏分析输入规范、代表性样本、指标、参数版本和算法评估方法。
  - 负责镜头切换、全局与局部运动、动作峰值等可解释候选检测，输出时间、强度、置信度、来源和低质量原因。
  - 负责代理帧采样、预处理和算法资源上限，与 FFmpeg 多媒体工程师维护的真实 PTS 和代理映射契约对接。
  - 负责视频候选算法的确定性、自动化测试、黄金结果、性能测量和已知失败模式，不直接修改人工或锁定事件。
  - 经典算法未达到已确认门槛时负责提交 ONNX/模型方案的证据与许可影响，不自行引入模型或扩大发布依赖。
  - 配合核心系统、构建和测试成员完成候选融合接口与验证；不擅自改变产品效果口径、媒体时间或核心融合语义。
