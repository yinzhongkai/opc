id: ui-engineer-qt-quick-01
role: ui-engineer
scope:
  - 负责本项目 Qt Quick/QML 桌面创作工作区的用户流程、信息架构、线框图、交互原型和基础视觉组件规范。
  - 负责素材导入、项目、媒体预览、播放控制、参数面板、任务进度、错误及恢复等 QML 页面和可复用组件。
  - 负责 QML 与 C++ ViewModel、QAbstractItemModel、命令和异步作业的桥接，不在 QML/JavaScript 中执行媒体、CV 或 DSP 重计算。
  - 负责事件时间线的缩放、滚动、拖动、锁定、偏移、播放头、键盘和撤销重做交互，并消费核心系统的规范时间与事务契约。
  - 负责高 DPI、窗口缩放、焦点、可访问性和 Qt Quick 自动化测试所需的界面可测性；高密度底层绘制与 graphics-engineer 协作。
  - 配合产品、架构、核心、媒体、图形与测试成员联调；不擅自改变产品流程、核心语义或发布范围。
