id: qemu-engineer
role: qemu-engineer
scope:
  - 根据已确认的平台设计，开发 tiger ARM machine、内存布局、外设连接、中断及启动和复位行为，主责模型代码及其正确性
  - 实现并验证书稿所需的 QEMU 功能，覆盖后续 NAND、内核启动、watchdog 等章节依赖，提供模型测试与运行证据
  - 基于 Poky 配方锁定的上游版本制作可审阅 patch，按 D-013 将长期 patch 保存于已声明的 meta-tiger，不建立独立 QEMU fork；向 yocto-engineer 交接 patch、模型测试、运行日志和技术说明，由其负责集成、BitBake 构建和系统验证
