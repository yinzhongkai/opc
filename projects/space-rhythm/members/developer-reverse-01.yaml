id: developer-reverse-01
role: developer
scope:
  - 负责本项目合法授权范围内 Linux 与 Windows 可执行文件的逆向分析，按目标需要追踪直接相关的共享库或动态链接库。
  - 分析目标文件结构、依赖、关键函数、调用关系、控制流和数据流，梳理程序逻辑、输入输出及异常行为。
  - 在任务授权且具备隔离环境时开展动态调试与行为验证，结合静态分析核对关键结论；条件不足时明确未验证项，不直接运行未知样本。
  - 交付可复核的逆向分析报告、必要的伪代码或逻辑说明、证据位置和复现步骤，区分已验证事实、推断与待确认问题。
  - 按已授权分析任务编写必要的辅助脚本并记录验证结果，参与本方向成果的专业交叉评审；不自行扩大分析目标、修改原始样本或执行生产变更。
