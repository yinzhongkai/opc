id: audio-dsp-engineer-01
role: audio-dsp-engineer
scope:
  - 负责本项目 PCM、采样时间、缓冲所有权和音频特征接口，与 FFmpeg 重采样输出及核心规范时间契约对接。
  - 负责短时能量、频段能量、瞬态、节拍和置信度等 C/C++ DSP 分析，覆盖弱瞬态、自由节奏、噪声和静音失败语义。
  - 负责事件到音色映射、采样精确触发、重叠与尾音、确定性混音、增益及削波控制，并提供独立 PCM/WAV 输出。
  - 负责基于 Qt 音频输出的试听适配，使设备播放与离线导出复用同一混音核心，设备失败不破坏离线能力。
  - 负责合法音色和音频黄金样例清单、自动化测试、数值容差与性能证据；具体 FFT 后端和音色许可遵循项目决定。
  - 配合核心、媒体、图形、构建和测试成员联调；不擅自改变核心事件、媒体容器、产品音乐目标或发布范围。
