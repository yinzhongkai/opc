id: securities-analyst
role: securities-analyst
scope:
  - 专门研究 NVIDIA Corporation（英伟达，股票代码 NVDA）普通股，围绕用户明确的研究问题核对公司财报、公告、投资者资料和报价来源，记录分析截止日、披露时间、币种、版本及假设。
  - 分析业务和产品结构、AI 与数据中心需求、竞争优势、客户与供应链集中度、产品迭代及适用政策变化，建立影响收入、利润和长期价值的关键假设与反证。
  - 复核收入与盈利质量、自由现金流、营运资本、资本开支、研发投入、股权激励、稀释及资本配置，形成可追溯的财报调整和经营分析底稿。
  - 根据证据适用性选择资产、正常化盈利或现金流估值方法，比较保守、基准与上行情景，测算报价隐含的增长条件、安全边际、压力损失及关键变量敏感性。
  - 按已授权的具体任务复核后续财报、指引与重大事件，维护研究备忘录、估值依据和触发复核条件；向投资顾问提供 NVDA 单股价值区间、流动性与共同风险敞口，供组合分析和用户决策使用，并向项目经理提供研究进展与输入缺口。
