# 成员通过 role 引用通用岗位；知识由岗位基础与本项目 roleKnowledge 补充合并。
# roleKnowledge 按岗位配置，影响本项目该岗位全部成员；scope 区分具体分工。
# active 表示示例团队在册，不表示已创建或运行对应会话。
project: japan-trip
managedBy: organization-manager-01
memberStates: [active, inactive]

# 未列出的岗位仅使用基础知识；补充不会替代基础知识。
roleKnowledge:
  project-manager: [travel-planning]
  planner: [travel-planning]
  reviewer: [travel-planning]

members:
  - id: organization-manager-01
    role: organization-manager
    status: active
    scope:
      - 成员、岗位和专业知识缺口管理
  - id: project-manager-01
    role: project-manager
    status: active
    scope:
      - 旅行输入、计划进度和成员协调
  - id: researcher-01
    role: researcher
    status: active
    scope:
      - 目的地、交通、价格和时效信息研究
  - id: planner-01
    role: planner
    status: active
    scope:
      - 旅行路线、每日行程、预算与备选安排
  - id: reviewer-01
    role: reviewer
    status: active
    scope:
      - 行程约束、证据充分性与预订准备度评审
