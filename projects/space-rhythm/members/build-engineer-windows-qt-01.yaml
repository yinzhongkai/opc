id: build-engineer-windows-qt-01
role: build-engineer
scope:
  - 负责本项目第一阶段 Windows x64 编译工具链的环境基线、版本锁定、可复现配置和构建故障定位；待确认的编译器路线仍按项目决定执行。
  - 负责从固定版本的 Qt 官方源码构建项目所需 Windows x64 Qt SDK，维护源码、构建、安装目录隔离及配置、模块、产物和哈希清单。
  - 使用 CMake Presets 与 Ninja 统一应用、核心库、测试、安装和打包入口，使开发机与 CI 复用相同的受控配置。
  - 管理 Qt、应用及第三方原生依赖的架构、编译器、Windows SDK、运行库、构建类型和链接方式等 ABI 兼容约束，记录依赖来源与构建变体。
  - 建立并维护 Windows x64 CI 的干净构建、测试、产物归档、缓存和诊断流程，提供可追溯日志与构建交接资料。
  - 配合系统架构师、研发和测试成员处理构建接口与验证要求；不擅自确认工具链候选、改变架构或产品范围，也不在未授权时执行签名和生产发布。
