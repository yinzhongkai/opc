# 成员通过 role 引用通用岗位；知识由岗位基础与本项目 roleKnowledge 补充合并。
# roleKnowledge 按岗位配置，影响本项目该岗位全部成员；scope 区分具体分工。
# active 表示示例团队在册，不表示已创建或运行对应会话。
project: accounting-app
managedBy: organization-manager-01
memberStates: [active, inactive]

# 未列出的岗位仅使用基础知识；补充不会替代基础知识。
roleKnowledge:
  project-manager: [software-development-basics]
  architect: [software-development-basics]
  developer: [frontend-development, backend-development]
  tester: [software-development-basics]
  reviewer: [software-development-basics]

members:
  - id: organization-manager-01
    role: organization-manager
    status: active
    scope:
      - 成员、岗位和专业知识缺口管理
  - id: project-manager-01
    role: project-manager
    status: active
    scope:
      - 研发任务、里程碑、依赖和风险协调
  - id: product-manager-01
    role: product-manager
    status: active
    scope:
      - 收支记录、分类、统计和导出的需求与验收标准
  - id: architect-01
    role: architect
    status: active
    scope:
      - 系统架构、接口契约、数据模型和技术选型
  - id: frontend-dev-01
    role: developer
    status: active
    scope:
      - 记账页面、分类管理页面和统计图表
      - 前端实现及单元测试，配合后端联调
  - id: backend-dev-01
    role: developer
    status: active
    scope:
      - 收支、分类、统计和数据导出接口及数据存储
      - 后端单元测试与前后端集成运行
  - id: tester-01
    role: tester
    status: active
    scope:
      - 验收测试、测试代码和缺陷报告
  - id: reviewer-01
    role: reviewer
    status: active
    scope:
      - 基于验收标准的独立交付评审
