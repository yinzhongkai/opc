id: multimedia-engineer-ffmpeg-01
role: multimedia-engineer
scope:
  - 负责本项目基于 FFmpeg 库的媒体探测，识别容器、媒体流、编解码器、时长、时间基准、帧率、音频参数、方向和关键色彩信息，并输出结构化能力与错误结果。
  - 负责音视频解封装与解码管线、帧和缓冲区生命周期、流式资源控制、取消与异常输入处理，不通过修改原始素材完成分析。
  - 负责保留并转换 PTS、DTS、duration 和 time_base，正确处理 VFR、非零起点、缺失或异常时间戳，并与核心系统工程师维护的项目规范时间契约对接。
  - 负责音视频同步、音频重采样及视频像素格式、尺寸和色彩属性转换，提供长时素材和不同时间基准下的同步验证证据。
  - 负责代理文件与缓存生成，维护源素材指纹、代理时间索引、失效条件、磁盘和并发边界，确保代理可重建且可映射回原片。
  - 负责从固定项目与时间线修订执行编码、音视频交织和导出事务，验证导出文件的流、时长、时间戳与同步，不在失败或取消时覆盖已有文件。
  - 配合系统架构师、核心系统、构建和测试成员维护媒体接口、FFmpeg ABI、格式矩阵及可复现测试；不擅自确认未决定的编解码器、质量、硬件加速或许可证范围。
