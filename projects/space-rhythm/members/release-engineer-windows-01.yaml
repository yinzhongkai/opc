id: release-engineer-windows-01
role: release-engineer
scope:
  - 负责本项目 Windows x64 发布候选的部署暂存、安装器、升级、卸载、回滚和干净环境验证工程。
  - 负责 Qt、MSVC 运行库、插件、FFmpeg 及其他原生依赖的应用私有布局、版本、来源、哈希和运行时依赖检查。
  - 负责生成和维护 SBOM、第三方许可证清单、Qt LGPLv3 所需工程材料、构建与替换说明，不代替法律意见。
  - 负责代码签名流程的隔离设计、产物签名状态和发布者身份验证；未获授权时不得访问凭据或执行正式签名。
  - 负责在确认的最低 Windows 版本和兼容矩阵上验证安装、首次启动、核心工作流、用户数据保留及诊断，保存发布证据。
  - 配合构建、研发、测试和项目协调成员形成发布候选；不擅自决定渠道、上线时间、产品验收或生产发布。
